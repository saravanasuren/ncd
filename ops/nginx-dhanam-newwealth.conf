# Dhanam New Wealth — nginx server block (co-tenant #5).
# Serves the React SPA (immutable hashed assets) and proxies /api → :3030.
# Host: ncd.dhanamfinance.com. Run certbot for it (see DEPLOY.md §2).
# NEVER edit the other four apps' nginx blocks.

server {
    listen 80;
    server_name ncd.dhanamfinance.com;
    access_log /var/log/nginx/access.log redacted;  # strips phone / PAN / search terms from the URL — see conf.d/pii-redaction.conf

    # ── Blocked source (owner instruction 2026-10-08) ──────────────────────
    # 23.153.36.167 self-registered seven staff/agent accounts via curl between
    # 07:37 and 07:58 IST on 2026-10-08 and created two customers before the
    # accounts were removed. 431 requests; 72 refused by permissions. Scoped to
    # THIS server block only — the other apps on this box are never touched.
    deny 23.153.36.167;
    allow all;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ncd.dhanamfinance.com;
    access_log /var/log/nginx/access.log redacted;  # strips phone / PAN / search terms from the URL — see conf.d/pii-redaction.conf

    # ── Blocked source (owner instruction 2026-10-08) ──────────────────────
    # 23.153.36.167 self-registered seven staff/agent accounts via curl between
    # 07:37 and 07:58 IST on 2026-10-08 and created two customers before the
    # accounts were removed. 431 requests; 72 refused by permissions. Scoped to
    # THIS server block only — the other apps on this box are never touched.
    deny 23.153.36.167;
    allow all;

    ssl_certificate     /etc/letsencrypt/live/ncd.dhanamfinance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ncd.dhanamfinance.com/privkey.pem;

    root /home/ubuntu/ncd/web/dist;
    index index.html;

    # API → Node service on :3030.
    location /api/ {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite-hashed assets are immutable — cache hard.
    location /assets/ {
        include /etc/nginx/snippets/ncd-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — index.html is never cached (so a new build is picked up).
    location / {
        include /etc/nginx/snippets/ncd-security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    # Receipt / KYC-doc uploads. Matches the largest express limit in
    # api/src/app.ts so the APP decides what is too big: a 10 MB KYC scan is
    # ~13.6 MB once base64-encoded into JSON, and a signed document may be
    # 20 MB (28 MB limit there). This was 6m, which returned a bare nginx 413
    # for any real file over ~4.5 MB — before validateUpload could say
    # "File too large (max 10 MB)". That is the enrolment-orphan failure the
    # owner hit (2026-09-09): the customer was created, the scan was refused.
    client_max_body_size 28m;
}
