# Keep customer identifiers out of the nginx access log.
#
#   Install: sudo cp ops/nginx-pii-redaction.conf /etc/nginx/conf.d/pii-redaction.conf
#            sudo nginx -t && sudo systemctl reload nginx
#   Used by: the ncd.dhanamfinance.com server blocks, via
#            `access_log /var/log/nginx/access.log redacted;`
#   conf.d is included BEFORE sites-enabled, so the format exists by the time a
#   vhost names it. deploy.sh does NOT copy this — install it by hand.
#
# Over seven days the NCD access log held ~2,500 lines carrying a customer
# phone number and a few dozen carrying a PAN — not in a payload, but in the
# URL itself, because several routes identify a person by phone or PAN:
#     GET /api/integration/customers-by-phone/9xxxxxxxxx   (~2,100 lines)
#     GET /api/lockers/customers/by-pan/AAAAA9999A
#     GET /api/dashboard/search?q=<a name, phone or PAN>
# The access log is world-readable to the adm group, is copied around in
# rotations, and long outlives any reason to keep the number.
#
# This rewrites the logged request line only. Nothing about the request itself
# changes, and the route is still visible — only the identifier is replaced, so
# the log is still usable for debugging and rate questions.
#
# First matching regex wins, so the most specific rule goes first.

map $request_uri $ncd_safe_uri {
    default $request_uri;

    # Search terms are free text: a name as often as a number. Drop the lot.
    "~^(?<s_path>/api/dashboard/search)\?.*$"                 "${s_path}?<redacted>";

    # An Indian mobile number anywhere in the path or query.
    "~^(?<p_pre>.*?)[6-9][0-9]{9}(?<p_post>.*)$"              "${p_pre}<phone-redacted>${p_post}";

    # A PAN anywhere in the path or query.
    "~^(?<n_pre>.*?)[A-Z]{5}[0-9]{4}[A-Z](?<n_post>.*)$"      "${n_pre}<pan-redacted>${n_post}";

    # An Aadhaar-shaped 12-digit run (none seen in the log, included so it
    # cannot start appearing unnoticed).
    "~^(?<a_pre>.*?)[0-9]{12}(?<a_post>.*)$"                  "${a_pre}<aadhaar-redacted>${a_post}";
}

# Identical to nginx's "combined", except the request line is rebuilt from the
# redacted URI instead of $request (which carries the raw one).
log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $ncd_safe_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
